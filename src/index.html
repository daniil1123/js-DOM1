<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calc">
    <h2>calculator</h2>
    <div class="inputs">
      <input type="number" id="num1" placeholder="first number" step="any">
      <input type="number" id="num2" placeholder="second number" step="any">
    </div>
    <div class="btns">
      <button id="add-btn">+</button>
      <button id="sub-btn">-</button>
      <button id="mul-btn">*</button>
      <button id="div-btn">/</button>
    </div>
    <div class="res" id="res">enter numbers</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
